<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Feuillet">
  <title>Feuillet</title>
  <defs>
    <linearGradient id="ff-tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7b86ff"/>
      <stop offset="0.52" stop-color="#4f5bff"/>
      <stop offset="1" stop-color="#3339d6"/>
    </linearGradient>
    <linearGradient id="ff-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#ff-tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#ff-sheen)"/>

  <!-- la feuille : un coin corné, comme une page qu'on vient de tourner -->
  <path
    d="M344 246h248l92 92v440H344Z"
    fill="#0c0c0d"
    stroke="#0c0c0d"
    stroke-width="30"
    stroke-linejoin="round"
  />
  <path d="M592 246v92h92" fill="#7b86ff" opacity="0.55"/>

  <!-- trois lignes : le texte, lisible même à 16 px -->
  <g stroke="#e7e9ff" stroke-width="30" stroke-linecap="round">
    <path d="M420 450h176"/>
    <path d="M420 522h176"/>
    <path d="M420 594h108"/>
  </g>
</svg>
