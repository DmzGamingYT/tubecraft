<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Séquence">
  <title>Séquence</title>
  <defs>
    <linearGradient id="sq-tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ff4056"/>
      <stop offset="0.52" stop-color="#f02540"/>
      <stop offset="1" stop-color="#c9152d"/>
    </linearGradient>
    <linearGradient id="sq-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#sq-tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sq-sheen)"/>

  <!-- le cadre : le repère, fin -->
  <rect x="216" y="216" width="592" height="592" rx="118" fill="none" stroke="#0c0c0d" stroke-opacity="0.42" stroke-width="34"/>

  <!-- la lecture : le geste, franc -->
  <path d="M456 404 664 512 456 620Z" fill="#0c0c0d" stroke="#0c0c0d" stroke-width="44" stroke-linejoin="round"/>
</svg>
