<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460" role="img" aria-label="TubeCraft — client YouTube open source, sans clé API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1f45"/>
      <stop offset="1" stop-color="#d80028"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.055">
    <circle cx="1280" cy="230" r="150"/>
    <circle cx="1280" cy="230" r="260"/>
    <circle cx="1280" cy="230" r="380"/>
    <circle cx="1280" cy="230" r="520"/>
  </g>
  <circle cx="1280" cy="230" r="260" fill="#ff0033" fill-opacity="0.05"/>

  <g transform="translate(96,96)">
    <rect x="0" y="0" width="300" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="17" r="5" fill="#ff0033"/>
    <text x="40" y="22" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="3" fill="#b9b3a8">CLIENT YOUTUBE OPEN SOURCE</text>
  </g>

  <g transform="translate(96,168)">
    <rect x="0" y="0" width="78" height="78" rx="22" fill="url(#mark)"/>
    <path d="M30 24 L56 39 L30 54 Z" fill="#ffffff"/>
  </g>

  <text x="200" y="228" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-3.5" fill="#f4f2ec">TubeCraft</text>
  <circle cx="640" cy="222" r="8" fill="#ff0033"/>

  <text x="96" y="300" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="27" fill="#cfc9bd">Recherche, lecteur, Shorts, abonnements, commentaires et mini-lecteur :</text>
  <text x="96" y="338" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="27" fill="#cfc9bd">de <tspan font-weight="600" fill="#f4f2ec">vraies données YouTube</tspan>, <tspan font-weight="600" fill="#f4f2ec">aucune clé API</tspan>, vos données chez vous.</text>

  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="2.5">
    <rect x="96" y="378" width="196" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="119" y="400" fill="#efe9dd">100 % LOCAL</text>
    <rect x="304" y="378" width="200" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="327" y="400" fill="#efe9dd">0 CLÉ API</text>
    <rect x="516" y="378" width="150" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="539" y="400" fill="#efe9dd">MIT</text>
  </g>
</svg>
