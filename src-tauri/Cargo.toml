[package]
name = "tubecraft"
version = "0.1.0"
description = "Séquence — client YouTube open source pour le bureau"
authors = ["Séquence"]
license = "MIT"
repository = "https://github.com/DmzGamingYT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tubecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
